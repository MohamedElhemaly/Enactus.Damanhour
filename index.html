<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Not Found</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #FFFFFF;
            --accent-glow: rgba(255, 204, 0, 0.4);
            --primary-yellow: #FFCC00;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 204, 0, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated Background Gradients */
        .glow-circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 1;
            animation: float 10s infinite ease-in-out alternate;
        }

        .glow-1 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, var(--primary-yellow), transparent 70%);
            top: -100px;
            left: -100px;
            opacity: 0.15;
        }

        .glow-2 {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, var(--primary-yellow), transparent 70%);
            bottom: -50px;
            right: -50px;
            opacity: 0.15;
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 50px) scale(1.1); }
        }

        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 4rem;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 25px 50px -12px rgba(255, 204, 0, 0.15);
            max-width: 90%;
            width: 600px;
            transform: translateY(0);
            animation: entrance 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes entrance {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .error-code {
            font-size: 8rem;
            font-weight: 700;
            line-height: 1;
            margin-bottom: 1rem;
            color: var(--primary-yellow);
            text-shadow: 0 0 40px var(--accent-glow);
            letter-spacing: -0.05em;
        }

        .error-title {
            font-size: 2rem;
            font-weight: 500;
            margin-bottom: 1rem;
            color: #e2e8f0;
        }

        .error-message {
            font-size: 1.125rem;
            font-weight: 300;
            color: #94a3b8;
            margin-bottom: 2.5rem;
            line-height: 1.6;
        }
        
        /* Mobile adjustments */
        @media (max-width: 640px) {
            .error-code { font-size: 5rem; }
            .error-title { font-size: 1.5rem; }
            .container { padding: 2.5rem 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="glow-circle glow-1"></div>
    <div class="glow-circle glow-2"></div>
    
    <div class="container">
        <div class="error-code">404</div>
        <h1 class="error-title">Page Not Found</h1>
        <p class="error-message">
            The page you are looking for might have been removed, had its name changed, or is temporarily unavailable. 
        </p>
    </div>
</body>
</html>
